<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lionel Messi: The Eternal GOAT</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Senin klasöründeki arkaplan.jpg dosyasını çağırır */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('./arkaplan.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
        }
        
        .hero-section {
            background: rgba(0, 77, 152, 0.6);
            padding: 40px 0;
            border-bottom: 5px solid #FFB703;
            backdrop-filter: blur(10px);
        }

        .success-card {
            cursor: pointer;
            transition: 0.3s;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .success-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
        }

        .success-card img {
            height: 450px;
            object-fit: cover;
            object-position: top;
        }

        .table-glass {
            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(15px);
            border-radius: 20px;
            overflow: hidden;
        }

        .gold-text { color: #ff8903; }
    </style>
</head>
<body>

    <header class="hero-section text-center shadow">
        <h1 class="display-2 fw-bold">LIONEL <span class="gold-text">MESSI</span></h1>
        <p class="lead fw-bold text-uppercase">Dünya Şampiyonu & Efsane</p>
    </header>

    <div class="container my-5">
        <div class="row g-4 mb-5">
            <!-- Dünya Kupası Bölümü -->
            <div class="col-md-4">
                <div class="card success-card" onclick="detayGoster('dunya-kupasi')">
                    <img src="./wc.jpg" class="card-img-top">
                    <div class="card-body text-center">
                        <h4 class="gold-text fw-bold">Dünya Kupası</h4>
                    </div>
                </div>
            </div>

            <!-- Ballon d'Or Bölümü -->
            <div class="col-md-4">
                <div class="card success-card" onclick="detayGoster('ballon-dor')">
                    <img src="./ballondor.jpg" class="card-img-top">
                    <div class="card-body text-center">
                        <h4 class="gold-text fw-bold">8 tane Ballon d'Or</h4>
                    </div>
                </div>
            </div>

            <!-- Şampiyonlar Ligi Bölümü -->
            <div class="col-md-4">
                <div class="card success-card" onclick="detayGoster('ucl')">
                    <img src="./ucl.jpg" class="card-img-top">
                    <div class="card-body text-center">
                        <h4 class="gold-text fw-bold">Şampiyonlar Ligi</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- Kariyer İstatistik Tablosu -->
        <div class="table-responsive table-glass shadow-lg p-3">
            <h3 class="text-center p-3 gold-text">Genel Kariyer Verileri</h3>
            <table class="table table-dark table-hover mb-0">
                <thead>
                    <tr class="text-info text-uppercase">
                        <th>Takım</th>
                        <th>Dönem</th>
                        <th class="text-center">Gol</th>
                        <th class="text-center">Asist</th>
                    </tr>
                </thead>
                <tbody id="tabloGövdesi"></tbody>
            </table>
        </div>
    </div>

    <!-- Tıklanınca Açılan Modal -->
    <div class="modal fade" id="basariModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered text-dark">
            <div class="modal-content text-center p-4" style="border-radius: 20px;">
                <h2 id="modalBaslik" class="fw-bold text-primary"></h2>
                <p id="modalIcerik" class="fs-5 mt-3"></p>
                <button type="button" class="btn btn-warning fw-bold px-5 mt-3" data-bs-dismiss="modal">KAPAT</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap ve Kendi JS Dosyamız -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
